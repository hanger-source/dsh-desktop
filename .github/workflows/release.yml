name: Release Hang DSH Plugins

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver, for example 0.3.0 or 0.4.0-beta.1
        required: true
        type: string
  push:
    tags:
      - 'hang-dsh-plugins-v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            tag="$REF_NAME"
            version="${tag#hang-dsh-plugins-v}"
          else
            version="${INPUT_VERSION#v}"
            tag="hang-dsh-plugins-v$version"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid semver: $version" >&2; exit 1; }
          [ "$(jq -r .version package.json)" = "$version" ] || { echo "package.json version does not match $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install current official DSH toolchain
        run: npm install --global npm@11.7.0 @deepseek-ai/dsh@next pnpm@11.24.0 --ignore-scripts --no-audit --no-fund
      - name: Verify release package
        run: |
          npm run check
          npm run verify:official
          mkdir -p dist
          npm pack --pack-destination dist --json > dist/pack.json
          (cd dist && sha256sum *.tgz > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish aggregate bundle to npm
        run: |
          package="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          local_integrity="$(jq -r '.[0].integrity' dist/pack.json)"
          published_integrity="$(npm view "$package@$version" dist.integrity --json --registry=https://registry.npmjs.org 2>/dev/null | jq -r '. // empty' || true)"
          if [ -n "$published_integrity" ]; then
            [ "$published_integrity" = "$local_integrity" ] || {
              echo "$package@$version already exists with different contents" >&2
              exit 1
            }
            echo "$package@$version is already published with the verified package contents"
          else
            npm publish --access public --provenance --registry=https://registry.npmjs.org
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            dist/*.tgz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  verify-published:
    needs: publish
    name: Verify npm package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install current official DSH toolchain
        run: npm install --global @deepseek-ai/dsh@next pnpm@11.24.0 --ignore-scripts --no-audit --no-fund
      - name: Verify published bundle through the official package manager
        run: npm run verify:official -- "@hanger-source/hang-dsh-plugins@${{ needs.publish.outputs.version }}"

  release:
    needs:
      - publish
      - verify-published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Create immutable tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release create "$TAG" dist/*.tgz dist/SHA256SUMS.txt \
            --generate-notes \
            --title "Hang DSH Plugins $VERSION"
