# 构建 DSH.app 原生壳并发布下载
# 触发方式：
#   - 手动（workflow_dispatch）：填版本号（如 0.1.0）→ 自动打 tag v0.1.0 并发布 Release；
#     留空 → 只构建并上传 artifact（Actions 页面下载，用于测试）
#   - 打 tag（v*，如 v1.0.0）→ 构建并上传 zip 到对应 GitHub Release 资产
name: Build DSH.app

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.1.0（自动打 tag v0.1.0 并发布 Release）；留空 = 只构建 artifact'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build DSH.app
        run: |
          mkdir -p dist/work
          cp packages/dsh-app-hub/assets/DSHApp/icon-512.png dist/work/icon-512.png
          bash packages/dsh-app-hub/assets/DSHApp/dsh-app-build.sh "$PWD/dist/DSH.app" "$PWD/dist/work"

      - name: Sanity check
        run: |
          test -x dist/DSH.app/Contents/MacOS/DSHApp
          test -f dist/DSH.app/Contents/Resources/icon.icns
          echo "binary + icon OK"

      - name: Package zip
        run: |
          cd dist
          ditto -c -k --keepParent DSH.app DSH.app.zip
          shasum -a 256 DSH.app.zip

      - name: Publish Release (version input or tag push)
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" dist/DSH.app.zip --generate-notes --title "DSH.app $TAG" 2>/dev/null || gh release upload "$TAG" dist/DSH.app.zip --clobber

      - name: Upload artifact (manual run, no version)
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: DSH.app.zip
          path: dist/DSH.app.zip
