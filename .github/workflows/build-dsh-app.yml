name: Release DSH Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App 版本，例如 0.2.0；留空自动递增 patch'
        required: false
  push:
    tags:
      - 'dsh-app-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine App version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            version="${tag#dsh-app-v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#dsh-app-v}"
            version="${version#v}"
            tag="dsh-app-v$version"
          else
            latest="$(gh release list --limit 200 --json tagName --jq '.[].tagName' | awk '/^dsh-app-v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' | sort -V | tail -1)"
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              base="${latest#dsh-app-v}"
              IFS='.' read -r major minor patch <<< "$base"
              version="$major.$minor.$((patch + 1))"
            fi
            tag="dsh-app-v$version"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "无效版本：$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify plugin manager release
        run: |
          set -euo pipefail
          tag='plugin-hang-dsh-plugins-v0.1.0'
          git cat-file -e "$tag^{commit}"
          git cat-file -e "$tag:plugins/hang-dsh-plugins/host/reconcile.js"
          version="$(git show "$tag:plugins/hang-dsh-plugins/package.json" | jq -r .version)"
          [ "$version" = '0.1.0' ] || { echo "插件管理器 tag 版本不一致：$version" >&2; exit 1; }

      - name: Build App
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/work
          cp apps/dsh/native/icon-512.png dist/work/icon-512.png
          bash apps/dsh/native/dsh-app-build.sh "$PWD/dist/DSH.app" "$PWD/dist/work" "$VERSION"

      - name: Verify release closure
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -x dist/DSH.app/Contents/MacOS/DSHApp
          test ! -e dist/DSH.app/Contents/Resources/runtime
          actual="$(defaults read "$PWD/dist/DSH.app/Contents/Info" CFBundleShortVersionString)"
          [ "$actual" = "$VERSION" ] || { echo "版本不一致：$actual != $VERSION" >&2; exit 1; }
          codesign --verify --deep --strict dist/DSH.app

      - name: Package DMG and ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/dmg-root
          ditto dist/DSH.app dist/dmg-root/DSH.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname 'DSH Desktop' -srcfolder dist/dmg-root -ov -format UDZO dist/DSH.dmg
          ditto -c -k --keepParent dist/DSH.app dist/DSH.app.zip
          (
            cd dist
            shasum -a 256 DSH.dmg DSH.app.zip > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/DSH.dmg dist/DSH.app.zip dist/SHA256SUMS.txt --clobber
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" dist/DSH.dmg dist/DSH.app.zip dist/SHA256SUMS.txt \
              --generate-notes --title "DSH Desktop $VERSION" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" dist/DSH.dmg dist/DSH.app.zip dist/SHA256SUMS.txt \
              --generate-notes --title "DSH Desktop $VERSION"
          fi
