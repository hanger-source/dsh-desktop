name: Release DSH Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App 版本，例如 0.3.20'
        required: true
  push:
    tags:
      - 'dsh-app-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine App version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            version="${tag#dsh-app-v}"
          else
            version="${INPUT_VERSION#dsh-app-v}"
            version="${version#v}"
            tag="dsh-app-v$version"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "无效版本：$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify Desktop runtime
        timeout-minutes: 5
        run: |
          npm --prefix apps/dsh/desktop-runtime ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm --prefix apps/dsh/desktop-runtime run check
          npm --prefix plugins/hang-dsh-plugins run check
      - name: Verify update checkpoint restore
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          dsh_home="$(mktemp -d)"
          swiftc -swift-version 5 -o "$build_dir/checkpoint-test" \
            apps/dsh/native/Runtime.swift \
            apps/dsh/native/AppUpdater.swift \
            apps/dsh/native/UpdateCoordinator.swift \
            apps/dsh/native/tests/UpdateCheckpointTest.swift \
            -framework AppKit -framework WebKit
          DSH_HOME="$dsh_home" "$build_dir/checkpoint-test"

      - name: Build App
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/work
          cp apps/dsh/native/icon-512.png dist/work/icon-512.png
          bash apps/dsh/native/dsh-app-build.sh "$PWD/dist/DSH.app" "$PWD/dist/work" "$VERSION"

      - name: Verify release closure
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -x dist/DSH.app/Contents/MacOS/DSHApp
          test -x dist/DSH.app/Contents/Resources/tools/DSHUpdateHelper
          test -f dist/DSH.app/Contents/Resources/tools/package-metadata.mjs
          manifest="dist/DSH.app/Contents/Resources/packages/manifest.json"
          test -f "$manifest"
          runtime_archive="$(jq -r .desktopRuntime.archive "$manifest")"
          manager_archive="$(jq -r .pluginManager.archive "$manifest")"
          test -f "dist/DSH.app/Contents/Resources/packages/$runtime_archive"
          test -f "dist/DSH.app/Contents/Resources/packages/$manager_archive"
          runtime_digest="$(jq -r .desktopRuntime.sha256 "$manifest")"
          manager_digest="$(jq -r .pluginManager.sha256 "$manifest")"
          [ "$(shasum -a 256 "dist/DSH.app/Contents/Resources/packages/$runtime_archive" | awk '{print $1}')" = "$runtime_digest" ]
          [ "$(shasum -a 256 "dist/DSH.app/Contents/Resources/packages/$manager_archive" | awk '{print $1}')" = "$manager_digest" ]
          runtime_version="$(jq -r .desktopRuntime.version "$manifest")"
          [ "$runtime_version" = "$VERSION" ] || { echo "Desktop 运行时版本不一致：$runtime_version != $VERSION" >&2; exit 1; }
          manager_version="$(jq -r .pluginManager.version "$manifest")"
          source_manager_version="$(jq -r .version plugins/hang-dsh-plugins/package.json)"
          [ "$manager_version" = "$source_manager_version" ] || { echo "插件管理器版本不一致：$manager_version != $source_manager_version" >&2; exit 1; }
          actual="$(defaults read "$PWD/dist/DSH.app/Contents/Info" CFBundleShortVersionString)"
          [ "$actual" = "$VERSION" ] || { echo "版本不一致：$actual != $VERSION" >&2; exit 1; }
          codesign --verify --deep --strict dist/DSH.app

      - name: Package DMG and ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/dmg-root
          ditto dist/DSH.app dist/dmg-root/DSH.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname 'DSH Desktop' -srcfolder dist/dmg-root -ov -format UDZO dist/DSH.dmg
          ditto -c -k --keepParent dist/DSH.app dist/DSH.app.zip
          (
            cd dist
            shasum -a 256 DSH.dmg DSH.app.zip > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/DSH.dmg dist/DSH.app.zip dist/SHA256SUMS.txt --clobber
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" dist/DSH.dmg dist/DSH.app.zip dist/SHA256SUMS.txt \
              --generate-notes --title "DSH Desktop $VERSION" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" dist/DSH.dmg dist/DSH.app.zip dist/SHA256SUMS.txt \
              --generate-notes --title "DSH Desktop $VERSION"
          fi
