# 构建 DSH.app 原生壳并发布下载（全自动：版本号自动递增，无需手动打 tag）
# 触发方式：
#   - 手动（workflow_dispatch）：点 Run workflow 即可——版本号留空自动递增 patch
#     （v0.1.0 → v0.1.1）并打 tag 发布 Release；也可填版本号（如 0.2.0）指定
#   - 打 tag（v*，如 v1.0.0）→ 构建并上传 zip 到对应 GitHub Release 资产
name: Build DSH.app

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.2.0；留空 = 自动递增 patch（v0.1.0 → v0.1.1）并发布 Release'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build DSH.app
        run: |
          mkdir -p dist/work
          cp packages/dsh-app-hub/assets/DSHApp/icon-512.png dist/work/icon-512.png
          bash packages/dsh-app-hub/assets/DSHApp/dsh-app-build.sh "$PWD/dist/DSH.app" "$PWD/dist/work"

      - name: Sanity check
        run: |
          test -x dist/DSH.app/Contents/MacOS/DSHApp
          test -f dist/DSH.app/Contents/Resources/icon.icns
          echo "binary + icon OK"

      - name: Package zip
        run: |
          cd dist
          ditto -c -k --keepParent DSH.app DSH.app.zip
          shasum -a 256 DSH.app.zip

      - name: Determine tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_VERSION" ]; then
            echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            latest=$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "$latest" ]; then
              echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
            else
              base=${latest#v}
              IFS='.' read -r maj min pat <<< "$base"
              echo "tag=v${maj}.${min}.$((pat + 1))" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Determined tag: $(grep '^tag=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" dist/DSH.app.zip --generate-notes --title "DSH.app $TAG" 2>/dev/null || gh release upload "$TAG" dist/DSH.app.zip --clobber
