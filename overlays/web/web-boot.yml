# DSH.app 启动 web profile 时注入的 overlay（仅 App 使用；手动 dsh web 不加载此 patch）。
# 1) 关闭自动打开浏览器：--no-open 在 --profile 模式下会被 dsh CLI 忽略（allowUnknownOption 吞掉），
#    必须从配置层 web-runtime.config.openBrowser=false 关掉，否则每次启动都弹浏览器。
# 2) insert 注入 dsh-boot 宿主引导插件：/api/dsh-plugins/enable 端点 + agent/created 自动启用
#    仓库 UI 插件（quota-monitor、dsh-app-hub 等）+ 父进程监控（App 退出/强杀 → 服务自行关闭）。
- id: web-runtime
  config:
    openBrowser: false

- insert:
    - id: dsh-boot
      name: /Users/fuhangbo/.dsh/hang-plugins/overlays/web/plugins/dsh-boot.js
