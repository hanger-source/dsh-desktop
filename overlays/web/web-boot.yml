# DSH.app 启动 web profile 时注入的 overlay（仅 App 使用；手动 dsh web 不加载此 patch）。
# 1) 关闭自动打开浏览器：--no-open 在 --profile 模式下会被 dsh CLI 忽略（allowUnknownOption 吞掉），
#    必须从配置层 web-runtime.config.openBrowser=false 关掉，否则每次启动都弹浏览器。
# 2) dsh-boot 在 Host 侧用首个可用 Agent 定义一组进程级仓库插件；dsh-client-bootstrap 是随 Web roster
#    静态加载的可信 Client 入口，负责启动与页面重载后的自动挂载，不进入动态审批队列。
# 3) dsh-boot 同时监控 App 父进程（App 退出/强杀 → 服务自行关闭）。
- id: web-runtime
  config:
    openBrowser: false

- insert:
    - id: dsh-boot
      name: __DSH_BOOT_PLUGIN__

    - id: dsh-client-bootstrap
      name: '@hanger/dsh-client-bootstrap'
